<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<style>
  :root {
    --bg1: #1c1233;
    --bg2: #0b0d17;
    --panel: rgba(255,255,255,.06);
    --text: #f1f0f8;
    --muted: #a49fbd;
    --accent: #a77bff;
    --accent2: #5ec8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 0%, var(--bg1), var(--bg2) 70%);
  }

  .player {
    width: 100%; max-width: 820px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
  }

  /* ---------- Now playing ---------- */
  .now { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .disc {
    width: 220px; height: 220px; max-width: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    position: relative;
    box-shadow: 0 16px 40px rgba(167,123,255,.35);
    animation: spin 12s linear infinite;
    animation-play-state: paused;
    transition: background .6s ease;
  }
  .disc::after {                 /* centre hole */
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--bg2);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.12);
  }
  .disc::before {                /* vinyl grooves */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0 9px, rgba(0,0,0,.14) 9px 10px);
  }
  .player.playing .disc { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .title  { margin-top: 22px; font-size: 1.35rem; font-weight: 650; }
  .artist { color: var(--muted); margin-top: 2px; }

  /* progress */
  .progress { width: 100%; margin-top: 22px; }
  .times { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(to right, var(--accent) var(--fill, 0%), rgba(255,255,255,.15) var(--fill, 0%));
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 4px rgba(167,123,255,.3);
    transition: transform .15s ease;
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: #fff; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; }
  .btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.2rem;
    transition: background .2s ease, transform .15s ease, color .2s ease;
  }
  .btn:hover { background: rgba(255,255,255,.1); transform: scale(1.08); }
  .btn:active { transform: scale(.94); }
  .btn:focus-visible { outline: 2px solid var(--accent); }
  .btn.on { color: var(--accent); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .btn.play { width: 62px; height: 62px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0b0d17; }
  .btn.play:hover { background: linear-gradient(135deg, var(--accent), var(--accent2)); filter: brightness(1.12); }
  .btn.play svg { width: 28px; height: 28px; }

  .volume { display: flex; align-items: center; gap: 10px; margin-top: 16px; width: 70%; }
  .volume .btn { width: 36px; height: 36px; }

  /* ---------- Playlist ---------- */
  .list-wrap { display: flex; flex-direction: column; min-height: 0; }
  .list-wrap h2 { font-size: 1rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; letter-spacing: .5px; text-transform: uppercase; }
  .playlist { list-style: none; overflow-y: auto; max-height: 400px; padding-right: 4px; }
  .playlist li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px; cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }
  .playlist li:hover { background: rgba(255,255,255,.08); transform: translateX(3px); }
  .playlist li.active { background: rgba(167,123,255,.2); }
  .playlist .num { width: 22px; text-align: center; color: var(--muted); font-size: .85rem; }
  .playlist li.active .num { color: var(--accent); }
  .playlist .info { flex: 1; min-width: 0; }
  .playlist .t { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist .a { font-size: .78rem; color: var(--muted); }
  .playlist .d { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .status { text-align: center; font-size: .8rem; color: #ff9a9a; margin-top: 10px; min-height: 1.2em; }

  /* ---------- Responsive ---------- */
  @media (max-width: 700px) {
    .player { grid-template-columns: 1fr; padding: 20px; gap: 20px; }
    .disc { width: 170px; height: 170px; }
    .playlist { max-height: 260px; }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <!-- Now playing -->
  <section class="now">
    <div class="disc" id="disc"></div>
    <div class="title" id="title">Loading…</div>
    <div class="artist" id="artist"></div>

    <div class="progress">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
    </div>

    <div class="controls">
      <button class="btn" id="shuffle" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4.2-1.6-1.2L12.9 6.2c.4-.5.9-.8 1.5-.8H17V3zM3 7h3.6c.6 0 1.2.3 1.5.8l6.8 9.1c.2.4.7.6 1.1.6H17v-3l4 4-4 4v-3h-1.9c-.6 0-1.2-.3-1.5-.8L6.8 9.6C6.6 9.2 6.1 9 5.7 9H3V7z"/></svg>
      </button>
      <button class="btn" id="prev" title="Previous (←)" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="btn play" id="play" title="Play / Pause (Space)" aria-label="Play">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn" id="next" title="Next (→)" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
      <button class="btn on" id="autoplay" title="Autoplay next song" aria-label="Autoplay">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="volume">
      <button class="btn" id="mute" title="Mute (M)" aria-label="Mute">
        <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    </div>
    <div class="status" id="status"></div>
  </section>

  <!-- Playlist -->
  <section class="list-wrap">
    <h2>Playlist</h2>
    <ul class="playlist" id="playlist"></ul>
  </section>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  /* ---------- Playlist data (edit this to use your own songs) ---------- */
  // src can be a URL or a local file path such as "songs/mysong.mp3".
  // Demo tracks are royalty-free samples from SoundHelix (needs internet).
  const tracks = [
    { title: "Sunrise Drive",   artist: "T. Schürger", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",  colors: ["#a77bff", "#5ec8ff"] },
    { title: "Neon Skyline",    artist: "T. Schürger", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",  colors: ["#ff7eb3", "#ff758c"] },
    { title: "Quiet Orbit",     artist: "T. Schürger", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",  colors: ["#43e97b", "#38f9d7"] },
    { title: "Golden Hour",     artist: "T. Schürger", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",  colors: ["#f9d423", "#ff4e50"] },
    { title: "Midnight Signal", artist: "T. Schürger", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",  colors: ["#667eea", "#764ba2"] }
  ];

  /* ---------- Elements ---------- */
  const $ = id => document.getElementById(id);
  const audio = $("audio"), player = $("player"), disc = $("disc");
  const seek = $("seek"), volume = $("volume");
  const playBtn = $("play"), playIcon = $("playIcon");
  const status = $("status");

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const ICON_VOL   = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>';
  const ICON_MUTE  = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';

  let current = 0;
  let autoplay = true;
  let shuffle = false;
  let lastVolume = 0.7;

  const fmt = s => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, "0")}`;
  };
  const setFill = (el) => {
    const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
    el.style.setProperty("--fill", pct + "%");
  };

  /* ---------- Build playlist ---------- */
  const listEl = $("playlist");
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="num">${i + 1}</span>
      <div class="info"><div class="t">${t.title}</div><div class="a">${t.artist}</div></div>
      <span class="d" id="d${i}">–:––</span>`;
    li.addEventListener("click", () => { loadTrack(i); play(); });
    listEl.appendChild(li);

    // read each song's duration in the background
    const probe = new Audio();
    probe.preload = "metadata";
    probe.src = t.src;
    probe.addEventListener("loadedmetadata", () => { $("d" + i).textContent = fmt(probe.duration); });
  });

  /* ---------- Core controls ---------- */
  function loadTrack(i) {
    current = (i + tracks.length) % tracks.length;
    const t = tracks[current];
    audio.src = t.src;
    $("title").textContent = t.title;
    $("artist").textContent = t.artist;
    disc.style.background = `linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]})`;
    document.title = `${t.title} – ${t.artist}`;
    seek.value = 0; setFill(seek);
    $("current").textContent = "0:00";
    $("duration").textContent = "0:00";
    status.textContent = "";
    [...listEl.children].forEach((li, idx) => li.classList.toggle("active", idx === current));
    listEl.children[current].scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function play() {
    const p = audio.play();
    if (p) p.catch(() => { status.textContent = "Press play to start (browser blocked autoplay)."; });
  }
  function pause() { audio.pause(); }
  function toggle() { audio.paused ? play() : pause(); }

  function nextIndex() {
    if (shuffle && tracks.length > 1) {
      let r;
      do { r = Math.floor(Math.random() * tracks.length); } while (r === current);
      return r;
    }
    return current + 1;
  }
  function next() { loadTrack(nextIndex()); play(); }
  function prev() {
    // restart song if it has played > 3 seconds, otherwise go to previous
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack(current - 1); play();
  }

  /* ---------- Audio events ---------- */
  audio.addEventListener("play", () => {
    player.classList.add("playing");
    playIcon.innerHTML = ICON_PAUSE;
    playBtn.setAttribute("aria-label", "Pause");
  });
  audio.addEventListener("pause", () => {
    player.classList.remove("playing");
    playIcon.innerHTML = ICON_PLAY;
    playBtn.setAttribute("aria-label", "Play");
  });
  audio.addEventListener("loadedmetadata", () => { $("duration").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    seek.value = (audio.currentTime / audio.duration) * 100;
    setFill(seek);
    $("current").textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("ended", () => {
    if (autoplay) { loadTrack(nextIndex()); play(); }
    else { audio.currentTime = 0; }
  });
  audio.addEventListener("error", () => {
    status.textContent = "Could not load this song. Check your internet connection or the file path.";
  });

  /* ---------- UI events ---------- */
  playBtn.addEventListener("click", toggle);
  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);

  seek.addEventListener("input", () => {
    if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
    setFill(seek);
  });

  function updateVolumeUI() {
    setFill(volume);
    $("volIcon").innerHTML = (audio.volume === 0 || audio.muted) ? ICON_MUTE : ICON_VOL;
  }
  volume.addEventListener("input", () => {
    audio.volume = parseFloat(volume.value);
    audio.muted = audio.volume === 0;
    if (audio.volume > 0) lastVolume = audio.volume;
    updateVolumeUI();
  });
  function toggleMute() {
    if (audio.volume === 0 || audio.muted) {
      audio.muted = false;
      audio.volume = lastVolume || 0.7;
      volume.value = audio.volume;
    } else {
      lastVolume = audio.volume;
      audio.volume = 0;
      volume.value = 0;
    }
    updateVolumeUI();
  }
  $("mute").addEventListener("click", toggleMute);

  $("autoplay").addEventListener("click", e => {
    autoplay = !autoplay;
    e.currentTarget.classList.toggle("on", autoplay);
  });
  $("shuffle").addEventListener("click", e => {
    shuffle = !shuffle;
    e.currentTarget.classList.toggle("on", shuffle);
  });

  /* ---------- Keyboard shortcuts ---------- */
  document.addEventListener("keydown", e => {
    const onRange = e.target.tagName === "INPUT";   // let sliders use their own arrow keys
    const onButton = e.target.tagName === "BUTTON"; // let focused buttons handle Space natively
    if (e.code === "Space" && !onButton) { e.preventDefault(); toggle(); }
    else if (e.code === "ArrowRight" && !onRange) { next(); }
    else if (e.code === "ArrowLeft" && !onRange) { prev(); }
    else if (e.key === "m" || e.key === "M") { toggleMute(); }
  });

  /* ---------- Init ---------- */
  audio.volume = parseFloat(volume.value);
  updateVolumeUI();
  setFill(seek);
  loadTrack(0);
</script>
</body>
</html>
